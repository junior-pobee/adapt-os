name: ADAPT OS Platform CI

on:
  push:
    branches:
      - feature/adapt-os-react-global-platform
  pull_request:
    branches:
      - main
      - fix/adapt-os-ui-markup
      - feature/adapt-os-global-modernization

jobs:
  web-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall services/ai_python
