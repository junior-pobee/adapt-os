<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>ADAPT AI</title>
 <link rel="stylesheet" href="ai.css">
</head>

<body>
 
 <div id="terminal">
  
  <div id="header">
   <span class="red"></span>
   <span class="yellow"></span>
   <span class="green"></span>
   <span class="title">ADAPT AI v1.0</span>
  </div>
  
  <div id="output">
   <!-- JavaScript will automatically clear this and print the security message -->
  </div>
  
  <div id="input-line">
   <span class="prompt">&gt;</span>
   <input id="commandInput" type="text" autocomplete="off" autofocus spellcheck="false">
  </div>
  
 </div>
 
 <!-- Perfectly linked to your script.js file -->
 <script src="ai.js"></script>
</body>

</html>
